# Workspace configuration for the latex-cv-tailor skill.
# Paths are relative to this file.

# Default candidate; an explicitly selected profile path overrides this.
profile_root: ./profile/hang
template_root: ./templates
default_template: ats-single-column
output_root: ./applications

language: en
latex_engine: tectonic
# No CV page cap. Preserve readable type, spacing and supported detail.
max_pages: null
overwrite_policy: create-new-version

# A cover letter is generated ONLY when the user asks for one. Default is the
# CV alone. Set to `always` to bring back the old behaviour.
cover_letter: on_request
cover_letter_formats: [markdown, pdf]
cover_letter_max_words: 200

# Only the two PDFs sit at the top of a job directory. Everything else - the
# job description, the plan, the .tex sources, the match report - goes in raw/,
# so the folder a person opens holds exactly what they send out.
keep_working_files_in: raw

# Contact fields that must be readable in the compiled PDF text layer.
# build_and_validate.py fails the build if any of these is missing.
required_pdf_fields: [full_name, email, phone]
